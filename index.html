at:"Дар бораи ман",story:"Ман Муҳаммад Қурбонов — барномасоз аз Душанбе. Аллакай 5 сол аст, ки ҳалли рақамӣ месозам. Ҳозир таҳсилро бо барноманависӣ якҷоя мекунам.\n\nҲадафи асосии ман — осон кардани кори муштариён аст. Ман ботҳои Telegram, барномаҳои мобилӣ, вебсайтҳо ва системаҳои автоматизатсия месозам, ки вақтро сарфа мекунанд ва корҳои такрориро кам мекунанд.\n\nДар кор барои ман сифат ва фаҳмидани ҳадафи мизоҷ муҳим аст. Махсусан вебсайтҳо, барномаҳои мобилӣ ва системаҳои автоматизатсияро дӯст медорам. Амалан аз Flutter, Dart, HTML/CSS/JS, Firebase ва баъзан Python истифода мебарам.\n\nЯке аз лоиҳаҳои дӯстдоштаам — WarePro. Ин барнома ба бизнес кӯмак мекунад, ки ҳисоб-китобро тақрибан монанди 1С пеш барад: аз омадани мол то фиристодани он. Он барои осон кардани кори соҳибкорон сохта шудааст.",whyh:"Чаро маро интихоб мекунанд",why:[["🎯","Масъалаи бизнесро ҳал мекунам","Танҳо код наменависам — масъалаи мушаххаси мизоҷро ҳал мекунам"],["⚡","Ҳалҳои коркунанда","Он чизеро месозам, ки вақтро сарфа мекунад ва корро осон мекунад"],["🎯","Ҳадафи мизоҷ дар марказ","Ҳамеша ҳадафи шуморо дар назар мегирам, на танҳо ҷиҳати техникӣ"],["✅","Сифат ва муҳлат","Бодиққат, бо эҳтиром ба муҳлат ва сифат кор мекунам"]],edh:"Таҳсилот",edu:"Донишгоҳи байналмилалии сайёҳӣ ва соҳибкории Тоҷикистон.",skh:"Малакаҳо",dl:"Бо ман тамос гиред",

at:"About me",story:"I’m Muhammad Qurbonov — a developer from Dushanbe. I’ve been building digital solutions for 5 years. Currently I combine my studies with development work.\n\nMy main goal is to make my clients’ work easier. I create Telegram bots, mobile apps, websites and automation systems that actually save time and remove routine tasks.\n\nIn my work I focus on quality and understanding the client’s real goal. I especially enjoy building websites, mobile apps and business process automation. I mainly work with Flutter, Dart, HTML/CSS/JS, Firebase, and sometimes Python.\n\nOne of my favourite projects is WarePro. It’s an app that helps businesses keep records almost like 1C — from goods arrival to dispatch. It was built to make life easier for entrepreneurs.",whyh:"Why clients choose me",why:[["🎯","I solve business problems","I don’t just write code — I solve a specific client problem"],["⚡","Solutions that work","I build things that actually save time and make work easier"],["🎯","Client goal first","I always keep your goal in focus, not only the technical side"],["✅","Quality & deadlines","I work carefully, with attention to detail and deadlines"]],edh:"Education",edu:"International University of Tourism and Entrepreneurship of Tajikistan.",skh:"Skills",dl:"Contact me",
